[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jimmy-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "boto3>=1.42,<2",
  "PyJWT[crypto]>=2.10,<3", "httpx>=0.28,<1", "mangum>=0.19,<1",
]

[project.optional-dependencies]
test = ["pytest", "PyYAML"]

[tool.setuptools]
packages = ["http_utils", "security"]

[tool.setuptools.package-dir]
http_utils = "http_utils/src"
security = "security/src"
