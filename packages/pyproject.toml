[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jimmy-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "boto3>=1.42,<2",
  "PyJWT[crypto]>=2.10,<3", "httpx>=0.28,<1", "mangum>=0.19,<1",
]

[project.optional-dependencies]
test = ["pytest", "PyYAML"]
research-tools = ["yfinance>=1.8,<2", "vectorbt>=0.28,<0.29", "plotly>=5,<7", "pandas>=2.2,<3", "numpy>=2,<2.3"]

[tool.setuptools]
packages = ["http_utils", "clients", "security", "tools"]

[tool.setuptools.package-dir]
http_utils = "http_utils/src"
clients = "clients/src"
security = "security/src"
tools = "tools/src"
