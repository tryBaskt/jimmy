name: Prepare deployment configuration
description: Validate the deployment branch and component outputs, then configure Terraform inputs.
inputs:
  auth:
    description: Load Cognito outputs from auth.json.
    default: 'false'
  workflow:
    description: Registered workflow ID to deploy.
    default: ''
runs:
  using: composite
  steps:
    - name: Validate environment and load outputs
      shell: bash
      env:
        INCLUDE_AUTH: ${{ inputs.auth }}
        WORKFLOW_ID: ${{ inputs.workflow }}
      run: |
        case "$GITHUB_REF" in
          refs/heads/dev|refs/heads/prod) environment=${GITHUB_REF##*/} ;;
          *) echo "Deployments require the matching dev/prod branch" >&2; exit 1 ;;
        esac
        load_outputs() {
          local component=$1
          jq -e --arg environment "$environment" '.environment == $environment' "$component.json" > /dev/null
          printf 'TF_VAR_%s=%s\n' "$component" "$(jq -c . "$component.json")" >> "$GITHUB_ENV"
        }
        load_outputs foundation
        if [[ "$INCLUDE_AUTH" == true ]]; then
          load_outputs auth
        fi
        if [[ -n "$WORKFLOW_ID" ]]; then
          [[ "$WORKFLOW_ID" =~ ^[a-z][a-z0-9_]{0,31}$ ]]
          workflow=$(jq -ce --arg id "$WORKFLOW_ID" '.workflows[] | select(.id == $id)' foundation.json)
          printf 'TF_VAR_workflow=%s\n' "$workflow" >> "$GITHUB_ENV"
        fi
        printf 'DEPLOY_ENV=%s\n' "$environment" >> "$GITHUB_ENV"
