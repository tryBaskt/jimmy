name: Deploy dev
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: jimmy-dev-deployment
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    environment:
      name: dev
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEPLOY_ENV: dev
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      YFINANCE_SHARED_CACHE: ${{ vars.YFINANCE_SHARED_CACHE || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deployment SDK
        run: pip install -c requirements.lock boto3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.7'
          terraform_wrapper: false
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Sync GitHub secrets to AWS Secrets Manager
        env:
          # Preserve the existing GitHub secret name; its value is the API key, not an ARN.
          BIGDATA_API_KEY: ${{ secrets.BIGDATA_SECRET_ARN }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python3 scripts/deployment_secrets.py sync >> "$GITHUB_ENV"
      - name: Deploy infrastructure and frontend
        run: scripts/deploy.sh
      - name: Configure alert recipient
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python3 scripts/deployment_secrets.py alerts --topic-arn "$(terraform -chdir=infra/environments output -raw alerts_topic_arn)"
