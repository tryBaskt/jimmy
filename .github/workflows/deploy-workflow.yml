name: Deploy registered workflow
on:
  workflow_call:
    inputs:
      workflow:
        description: Registered workflow metadata as JSON.
        required: true
        type: string
defaults:
  run:
    shell: bash
permissions:
  contents: read
  id-token: write
jobs:
  publish-images:
    name: Publish ${{ fromJSON(inputs.workflow).name }} images
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      WORKFLOW_ID: ${{ fromJSON(inputs.workflow).id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foundation-${{ github.sha }}
      - uses: ./.github/actions/deployment-config
        with:
          workflow: ${{ fromJSON(inputs.workflow).id }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ format('arn:aws:iam::{0}:role/jimmy-{1}-github-deploy', secrets.AWS_ACCOUNT_ID, github.ref_name) }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Publish workflow API image
        uses: ./.github/actions/build-image
        with:
          workflow: ${{ fromJSON(inputs.workflow).id }}
          component: api
      - name: Publish workflow runtime image
        uses: ./.github/actions/build-image
        with:
          workflow: ${{ fromJSON(inputs.workflow).id }}
          component: runtime

  provision-workflow:
    name: Provision ${{ fromJSON(inputs.workflow).name }}
    needs: publish-images
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      STATE_BUCKET: ${{ format('jimmy-{0}-state-{1}', github.ref_name, secrets.AWS_ACCOUNT_ID) }}
      WORKFLOW_ID: ${{ fromJSON(inputs.workflow).id }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6.1-sol' }}
      RESEARCH_ASSISTANT_MODEL: ${{ vars.RESEARCH_ASSISTANT_MODEL || 'gpt-5-mini' }}
      PI_MAX_MODEL_CALLS: ${{ vars.PI_MAX_MODEL_CALLS || '48' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foundation-${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: auth-${{ github.sha }}
      - uses: ./.github/actions/deployment-config
        with:
          auth: 'true'
          workflow: ${{ fromJSON(inputs.workflow).id }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ format('arn:aws:iam::{0}:role/jimmy-{1}-github-deploy', secrets.AWS_ACCOUNT_ID, github.ref_name) }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve published workflow images
        run: |
          api_repository=$(jq -er --arg id "$WORKFLOW_ID" '.repositories[$id].api | select(type == "string" and length > 0)' foundation.json)
          runtime_repository=$(jq -er --arg id "$WORKFLOW_ID" '.repositories[$id].runtime | select(type == "string" and length > 0)' foundation.json)
          for repository in "$api_repository" "$runtime_repository"; do
            aws ecr describe-images --repository-name "${repository#*/}" --image-ids "imageTag=$GITHUB_SHA" > /dev/null
          done
          printf 'TF_VAR_api_image=%s:%s\nTF_VAR_runtime_image=%s:%s\n' "$api_repository" "$GITHUB_SHA" "$runtime_repository" "$GITHUB_SHA" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false
      - name: Verify OpenAI configuration
        if: ${{ fromJSON(inputs.workflow).requires_openai }}
        run: test -n "$OPENAI_MODEL" && test -n "$RESEARCH_ASSISTANT_MODEL"
      - name: Provision workflow
        env:
          TF_VAR_openai_model: ${{ env.OPENAI_MODEL }}
          TF_VAR_research_assistant_model: ${{ env.RESEARCH_ASSISTANT_MODEL }}
          TF_VAR_pi_max_model_calls: ${{ env.PI_MAX_MODEL_CALLS }}
        run: |
          if ! [[ "$STATE_BUCKET" =~ ^jimmy-(dev|prod)-state-[0-9]{12}$ ]]; then
            echo "Invalid Terraform state bucket configuration" >&2
            exit 1
          fi
          terraform -chdir=infra/workflows init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="key=workflows/$WORKFLOW_ID/terraform.tfstate" -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true" -backend-config="encrypt=true"
          terraform -chdir=infra/workflows validate
          terraform -chdir=infra/workflows plan -input=false -out=workflow.tfplan
          terraform -chdir=infra/workflows apply -input=false workflow.tfplan
