name: Dev IAM

on:
  push:
    branches: [dev]
    paths:
      - infra/dev/iam/dynamodb-provisioning.json
      - .github/workflows/dev-iam.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jimmy-dev-iam
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  iam:
    name: Configure dev deployment permissions
    needs: ci
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: dev-iam
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      DEPLOYMENT_ROLE: jimmy-dev-github-actions
      BOUNDARY_ARN: arn:aws:iam::499133675835:policy/jimmy-dev-deployment-boundary
      POLICY_NAME: jimmy-dev-dynamodb-provisioning
    steps:
      - name: Check out reviewed dev commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Authenticate with the dedicated IAM role
        uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        with:
          role-to-assume: arn:aws:iam::499133675835:role/jimmy-dev-iam
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '499133675835'
          role-session-name: jimmy-dev-iam-${{ github.run_id }}
          role-duration-seconds: 900
          unset-current-credentials: true
      - name: Install the approved permissions boundary first
        run: |
          aws iam put-role-permissions-boundary \
            --role-name "${DEPLOYMENT_ROLE}" \
            --permissions-boundary "${BOUNDARY_ARN}"
          actual="$(aws iam get-role --role-name "${DEPLOYMENT_ROLE}" \
            --query 'Role.PermissionsBoundary.PermissionsBoundaryArn' --output text)"
          test "${actual}" = "${BOUNDARY_ARN}"
      - name: Install and verify scoped DynamoDB provisioning policy
        run: |
          aws iam put-role-policy \
            --role-name "${DEPLOYMENT_ROLE}" \
            --policy-name "${POLICY_NAME}" \
            --policy-document file://infra/dev/iam/dynamodb-provisioning.json
          aws iam get-role-policy \
            --role-name "${DEPLOYMENT_ROLE}" \
            --policy-name "${POLICY_NAME}" \
            --query PolicyDocument --output json > "${RUNNER_TEMP}/installed-policy.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          expected = json.loads(Path('infra/dev/iam/dynamodb-provisioning.json').read_text())
          installed = json.loads((Path(os.environ['RUNNER_TEMP']) / 'installed-policy.json').read_text())
          assert installed == expected, 'Installed policy differs from the reviewed policy'
          PY
          echo 'Dev deployment policy installed with the approved boundary.' >> "${GITHUB_STEP_SUMMARY}"
