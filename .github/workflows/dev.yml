name: Dev infrastructure

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jimmy-dev
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  provisioning_infra:
    name: provisioning infra
    needs: ci
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: '499133675835'
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      STATE_BUCKET: jimmy-dev-terraform-state-499133675835
    defaults:
      run:
        working-directory: infra/dev
    steps:
      - name: Check out dev infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false
      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        with:
          role-to-assume: arn:aws:iam::499133675835:role/jimmy-dev-github-actions
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: jimmy-dev-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true
      - name: Verify AWS account
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          test "${account}" = "${AWS_ACCOUNT_ID}"
      - name: Bootstrap and secure persistent Terraform state
        run: |
          if ! aws s3api head-bucket --bucket "${STATE_BUCKET}" \
            --expected-bucket-owner "${AWS_ACCOUNT_ID}" 2> "${RUNNER_TEMP}/state-bucket-error"; then
            if ! grep -q '(404)' "${RUNNER_TEMP}/state-bucket-error"; then
              cat "${RUNNER_TEMP}/state-bucket-error" >&2
              exit 1
            fi
            aws s3api create-bucket --bucket "${STATE_BUCKET}" --region "${AWS_REGION}"
          fi
          aws s3api put-public-access-block --bucket "${STATE_BUCKET}" \
            --expected-bucket-owner "${AWS_ACCOUNT_ID}" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws s3api put-bucket-versioning --bucket "${STATE_BUCKET}" \
            --expected-bucket-owner "${AWS_ACCOUNT_ID}" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket "${STATE_BUCKET}" \
            --expected-bucket-owner "${AWS_ACCOUNT_ID}" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-bucket-tagging --bucket "${STATE_BUCKET}" \
            --expected-bucket-owner "${AWS_ACCOUNT_ID}" \
            --tagging 'TagSet=[{Key=Project,Value=jimmy},{Key=Environment,Value=dev},{Key=Purpose,Value=terraform-state}]'
          cat > "${RUNNER_TEMP}/state-bucket-policy.json" <<JSON
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Sid": "DenyInsecureTransport",
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:*",
              "Resource": ["arn:aws:s3:::${STATE_BUCKET}", "arn:aws:s3:::${STATE_BUCKET}/*"],
              "Condition": {"Bool": {"aws:SecureTransport": "false"}}
            }]
          }
          JSON
          aws s3api put-bucket-policy --bucket "${STATE_BUCKET}" \
            --expected-bucket-owner "${AWS_ACCOUNT_ID}" \
            --policy "file://${RUNNER_TEMP}/state-bucket-policy.json"
      - name: Initialize Terraform with persistent state
        run: terraform init -input=false -lockfile=readonly
      - name: Validate Terraform
        run: terraform validate
      - name: Plan dev infrastructure
        run: terraform plan -input=false -lock-timeout=5m -out=dev.tfplan
      - name: Apply the saved plan
        run: terraform apply -input=false -lock-timeout=5m dev.tfplan
      - name: Verify DynamoDB provisioning
        run: |
          table="$(terraform output -raw stock_metadata_table_name)"
          membership="$(terraform output -raw stock_universe_membership_table_name)"
          for table_name in "${table}" "${membership}"; do
            aws dynamodb wait table-exists --table-name "${table_name}"
            aws dynamodb describe-table --table-name "${table_name}" \
              --query 'Table.{Name:TableName,Status:TableStatus,Arn:TableArn}'
          done
          {
            echo '### Dev infrastructure provisioned'
            echo "Account: ${AWS_ACCOUNT_ID}"
            echo "Region: ${AWS_REGION}"
            echo "DynamoDB table: ${table}"
            echo "Universe membership table: ${membership}"
            echo 'Role: jimmy-dev-github-actions'
            echo "Terraform state: s3://${STATE_BUCKET}/dev/terraform.tfstate"
          } >> "${GITHUB_STEP_SUMMARY}"

  provisioning_api:
    name: provisioning api
    needs: provisioning_infra
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev
    permissions:
      id-token: write
      contents: read
    outputs:
      api_url: ${{ steps.outputs.outputs.api_url }}
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_package_path: ${{ github.workspace }}/api/build/api.zip
      TF_VAR_jobs_queue_url: https://sqs.us-east-1.amazonaws.com/499133675835/jimmy-dev-strategy-jobs
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Build Linux Lambda package
        run: |
          python -m pip install --no-compile -r api/requirements-lambda.txt --target api/build/package
          cp -R api/app api/build/package/app
          python -c "import shutil; shutil.make_archive('api/build/api', 'zip', 'api/build/package')"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false
      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        with:
          role-to-assume: arn:aws:iam::499133675835:role/jimmy-dev-github-actions
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '499133675835'
          role-session-name: jimmy-dev-api-${{ github.run_id }}
          unset-current-credentials: true
      - name: Provision API
        working-directory: infra/dev/api
        run: |
          terraform init -input=false -lockfile=readonly
          terraform validate
          terraform plan -input=false -lock-timeout=5m -out=api.tfplan
          terraform apply -input=false -lock-timeout=5m api.tfplan
      - name: Verify API and publish its URL
        id: outputs
        working-directory: infra/dev/api
        run: |
          api_url="$(terraform output -raw api_url)"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${api_url}/api/health" | python -c 'import json,sys; assert json.load(sys.stdin) == {"status":"ok","service":"jimmy-api"}'
          echo "api_url=${api_url}" >> "${GITHUB_OUTPUT}"
          echo "API: ${api_url}/api/health" >> "${GITHUB_STEP_SUMMARY}"

  provisioning_frontend:
    name: provisioning frontend
    needs: provisioning_api
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: dev
    permissions:
      id-token: write
      contents: read
    outputs:
      frontend_url: ${{ steps.auth.outputs.frontend_url }}
      cognito_domain: ${{ steps.auth.outputs.cognito_domain }}
      cognito_client_id: ${{ steps.auth.outputs.cognito_client_id }}
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_api_url: ${{ needs.provisioning_api.outputs.api_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false
      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        with:
          role-to-assume: arn:aws:iam::499133675835:role/jimmy-dev-github-actions
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '499133675835'
          role-session-name: jimmy-dev-frontend-${{ github.run_id }}
          unset-current-credentials: true
      - name: Provision frontend
        working-directory: infra/dev/frontend
        run: |
          terraform init -input=false -lockfile=readonly
          terraform validate
          terraform plan -input=false -lock-timeout=5m -out=frontend.tfplan
          terraform apply -input=false -lock-timeout=5m frontend.tfplan
      - name: Publish auth configuration
        id: auth
        working-directory: infra/dev/frontend
        run: |
          {
            echo "frontend_url=$(terraform output -raw frontend_url)"
            echo "cognito_domain=$(terraform output -raw cognito_domain)"
            echo "cognito_client_id=$(terraform output -raw cognito_client_id)"
          } >> "${GITHUB_OUTPUT}"
      - name: Publish frontend and verify API routing
        working-directory: infra/dev/frontend
        run: |
          bucket="$(terraform output -raw bucket_name)"
          distribution="$(terraform output -raw distribution_id)"
          frontend_url="$(terraform output -raw frontend_url)"
          # Retain old hashed assets so already-open browser tabs keep working.
          aws s3 sync ../../../frontend/dist/ "s3://${bucket}/" \
            --exclude index.html --cache-control 'public,max-age=31536000,immutable' --only-show-errors
          aws s3 cp ../../../frontend/dist/index.html "s3://${bucket}/index.html" \
            --content-type 'text/html' --cache-control 'no-cache' --only-show-errors
          invalidation="$(aws cloudfront create-invalidation --distribution-id "${distribution}" \
            --paths '/*' --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "${distribution}" --id "${invalidation}"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${frontend_url}/" --output /dev/null
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${frontend_url}/api/health" | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"status":"ok","service":"jimmy-api"}'
          echo "Frontend: ${frontend_url}" >> "${GITHUB_STEP_SUMMARY}"

  configure_api_auth:
    name: configure api auth
    needs: provisioning_frontend
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_package_path: ${{ github.workspace }}/api/build/api.zip
      TF_VAR_jobs_queue_url: https://sqs.us-east-1.amazonaws.com/499133675835/jimmy-dev-strategy-jobs
      TF_VAR_cognito_domain: ${{ needs.provisioning_frontend.outputs.cognito_domain }}
      TF_VAR_cognito_client_id: ${{ needs.provisioning_frontend.outputs.cognito_client_id }}
      TF_VAR_public_url: ${{ needs.provisioning_frontend.outputs.frontend_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Build Linux Lambda package
        run: |
          python -m pip install --no-compile -r api/requirements-lambda.txt --target api/build/package
          cp -R api/app api/build/package/app
          python -c "import shutil; shutil.make_archive('api/build/api', 'zip', 'api/build/package')"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        with:
          role-to-assume: arn:aws:iam::499133675835:role/jimmy-dev-github-actions
          aws-region: us-east-1
          allowed-account-ids: '499133675835'
      - name: Configure API with Cognito client
        working-directory: infra/dev/api
        run: |
          terraform init -input=false -lockfile=readonly
          terraform plan -input=false -lock-timeout=5m -out=api-auth.tfplan
          terraform apply -input=false -lock-timeout=5m api-auth.tfplan

  provisioning_worker:
    name: provisioning strategy worker
    needs: provisioning_infra
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        with:
          role-to-assume: arn:aws:iam::499133675835:role/jimmy-dev-github-actions
          aws-region: us-east-1
          allowed-account-ids: '499133675835'
      - name: Build and push worker image
        id: image
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          test "${account}" = '499133675835'
          registry="${account}.dkr.ecr.us-east-1.amazonaws.com"
          repository="${registry}/jimmy-dev-strategy-worker"
          tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${registry}"
          docker build --platform linux/amd64 -f workers/strategy_worker/Dockerfile -t "${repository}:${tag}" .
          docker push "${repository}:${tag}"
          digest="$(aws ecr describe-images --repository-name jimmy-dev-strategy-worker --image-ids "imageTag=${tag}" --query 'imageDetails[0].imageDigest' --output text)"
          echo "image_uri=${repository}@${digest}" >> "${GITHUB_OUTPUT}"
      - name: Provision Fargate worker
        working-directory: infra/dev/worker
        env:
          TF_VAR_image_uri: ${{ steps.image.outputs.image_uri }}
        run: |
          terraform init -input=false -lockfile=readonly
          terraform validate
          terraform plan -input=false -lock-timeout=5m -out=worker.tfplan
          terraform apply -input=false -lock-timeout=5m worker.tfplan
