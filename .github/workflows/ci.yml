name: Validate paper replication
on:
  pull_request:
    branches: [dev, main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -c requirements.lock -e '.[dev]'
      - run: ruff check apis packages workers scripts tests
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.7'
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/environments init -backend=false && terraform -chdir=infra/environments validate
      - run: terraform -chdir=infra/bootstrap init -backend=false && terraform -chdir=infra/bootstrap validate

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Build deployable image
        run: docker build --target ${{ matrix.target }} --tag jimmy-ci-${{ matrix.target }} .
      - name: Verify installed service and worker packages
        run: >-
          docker run --rm --entrypoint python -e PAPERLAB_ROOT=/tmp/jimmy-ci
          jimmy-ci-${{ matrix.target }}
          -c "from apis.app import app; import paperlab.workflow; import workers.replication.main; assert app.routes"
