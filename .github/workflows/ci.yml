name: CI

on:
  pull_request:
    branches: [main, dev]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    name: Validate workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
      - name: Validate GitHub Actions workflows
        run: '"${RUNNER_TEMP}/actionlint" -color'

  terraform:
    name: Validate dev Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false
      - name: Check and validate Terraform roots
        run: |
          terraform fmt -check -recursive infra/dev
          for root in infra/dev infra/dev/api infra/dev/frontend; do
            terraform -chdir="${root}" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="${root}" validate
          done
      - name: Validate policy JSON
        run: |
          python3 -m json.tool infra/dev/iam/dynamodb-provisioning.json > /dev/null
          python3 -m json.tool infra/dev/iam/terraform-state.json > /dev/null
          python3 -m json.tool infra/dev/iam/fmp-secret-provisioning.json > /dev/null
          python3 -m json.tool infra/dev/iam/application-provisioning.json > /dev/null


  api:
    name: Validate FastAPI API
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install API dependencies
        run: python -m pip install -r api/requirements-dev.txt -r api/requirements-lambda.txt
      - name: Test API and Lambda handler
        run: python -m pytest -c api/pytest.ini api/tests

  strategy_agent:
    name: Validate strategy agent
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install strategy dependencies
        run: python -m pip install -r packages/agents/strategy_agent/requirements.txt pytest==9.1.1
      - name: Test agent harness and strategy agent
        run: python -m pytest packages/agent_harness/tests packages/agents/strategy_agent/tests -q

  frontend:
    name: Validate React frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend
        run: |
          npm ci
          npm run lint
          npm run build
