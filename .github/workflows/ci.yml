name: CI
on:
  pull_request:
  push:
    branches-ignore: [dev, prod]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.catalog.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - id: catalog
        uses: ./.github/actions/workflow-catalog
  verify-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e 'packages[test]'
      - run: python -m pytest packages .github/tests
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web test
      - run: npm --prefix apps/web run build
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/foundation init -backend=false && terraform -chdir=infra/foundation validate
      - run: terraform -chdir=infra/foundation test
      - run: terraform -chdir=infra/auth init -backend=false && terraform -chdir=infra/auth validate
      - run: terraform -chdir=infra/github init -backend=false && terraform -chdir=infra/github validate
      - run: terraform -chdir=infra/workflows init -backend=false && terraform -chdir=infra/workflows validate
  verify-workflow:
    name: Test ${{ matrix.workflow.name }}
    needs: catalog
    strategy:
      fail-fast: false
      matrix:
        workflow: ${{ fromJSON(needs.catalog.outputs.workflows) }}
    runs-on: ubuntu-latest
    env:
      WORKFLOW_ID: ${{ matrix.workflow.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e packages -e "services/$WORKFLOW_ID" pytest
      - name: Verify API imports with base dependencies
        run: python -c 'import importlib, os; importlib.import_module(os.environ["WORKFLOW_ID"] + "_api")'
      - run: pip install -e "services/$WORKFLOW_ID[runtime]"
      - run: python -m pytest "services/$WORKFLOW_ID/tests"
