[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paperlab"
version = "0.1.0"
description = "Traceable finance paper replication and extrapolation workspace"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "mangum>=0.19,<1", "pydantic>=2.10,<3", "boto3>=1.40,<2", "PyJWT[crypto]>=2.10,<3", "pandas>=2.2,<3", "numpy>=2.1,<3", "statsmodels>=0.14,<1", "pypdf>=6,<7", "httpx>=0.28,<1", "yfinance>=1.2,<2", "python-multipart>=0.0.20"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "moto[s3,dynamodb,stepfunctions]>=5,<6"]

[tool.setuptools.packages.find]
where = ["packages", "."]
include = ["paperlab*", "apis*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
